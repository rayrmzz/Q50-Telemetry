plugins {
    alias(libs.plugins.android.library)
}

// Sensor capture and state shared by the Inspector and the dashboard. No runtime deps.
android {
    namespace 'com.q50.core'

    enableKotlin = false

    compileSdk {
        version = release(37)
    }

    defaultConfig {
        minSdk {
            version = release(10)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
}
